<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#164d6b">
  <title>Our Little Universe 🌷</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="scene">
    <div class="petals" id="petals"></div>

    <section class="welcome-card" id="welcomeCard">
      <p class="pretitle">Welcome to ♡</p>

      <h1>Our Pocket<br>Of<br>Infinity</h1>

      <p class="tagline">A special place, just for you</p>

      <div class="divider">✦</div>

      <p class="message">
        Some moments are too special to be forgotten,
        this is one of them... ♡
      </p>

      <form id="loginForm">
        <input
          type="password"
          id="password"
          placeholder="Enter Password..."
          autocomplete="current-password"
          aria-label="Enter password"
          required
        >
        <button type="submit" aria-label="Enter">➜</button>
      </form>

      <p id="errorMessage" role="status" aria-live="polite"></p>

      <p class="special-date">♡ October 20, 2026 ♡</p>

      <p class="made-for">For MgMg's KaLayLay, with love.</p>

      <!-- Appears after the correct password -->
      <div class="success-message" id="successMessage" aria-live="polite">
        <span class="success-heart">♡</span>
        <p>Welcome to our little universe, my love.</p>
        <small>Every little moment belongs to us ✨</small>
      </div>
    </section>

    
  </main>

  
  <script src="script.js"></script>
</body>
</html>
